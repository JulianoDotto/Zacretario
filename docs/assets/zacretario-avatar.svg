<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14A085"/>
      <stop offset="1" stop-color="#075E54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03342E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background (WhatsApp crops to a circle; all content stays inside the safe area) -->
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- calendar card -->
  <g filter="url(#shadow)">
    <rect x="170" y="176" width="300" height="290" rx="44" fill="#FFFFFF"/>
    <path d="M170 220 a44 44 0 0 1 44 -44 h212 a44 44 0 0 1 44 44 v40 h-300 z" fill="#FFB547"/>
  </g>

  <!-- binder rings -->
  <rect x="236" y="146" width="26" height="64" rx="13" fill="#FFFFFF"/>
  <rect x="378" y="146" width="26" height="64" rx="13" fill="#FFFFFF"/>
  <rect x="242" y="152" width="14" height="52" rx="7" fill="#0B6E5F"/>
  <rect x="384" y="152" width="14" height="52" rx="7" fill="#0B6E5F"/>

  <!-- the Z -->
  <path d="M248 300 h144 v28 l-100 92 h100 v30 h-148 v-28 l100 -92 h-96 z" fill="#075E54"/>

  <!-- check badge -->
  <g filter="url(#shadow)">
    <circle cx="446" cy="446" r="62" fill="#25D366"/>
  </g>
  <circle cx="446" cy="446" r="62" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M418 448 l20 20 l38 -42" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
